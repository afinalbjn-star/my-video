name: Render Remotion Video

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      compositionId:
        type: choice
        description: 'Pilih ID Komposisi yang ingin dirender'
        required: true
        options:
          - AbstractLoopBackground
          - NeonCyberTerrain
          - GoldenNetworkBackground
          - ProfessionalAbstractVideo
      crf:
        description: 'Kualitas Video / CRF (0-51, makin rendah makin tajam, default: 16)'
        required: false
        default: '10'
      bitrate:
        description: 'Bitrate (opsional, contoh: 20M. Jika diisi, CRF akan diabaikan oleh FFmpeg)'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Render Video
        env:
          BLUESMIND_API_BASE_URL: ${{ secrets.BLUESMIND_API_BASE_URL }}
          BLUESMIND_API_KEY: ${{ secrets.BLUESMIND_API_KEY }}
        run: |
          COMP_ID="${{ github.event.inputs.compositionId || 'GoldenNetworkBackground' }}"
          CRF="${{ github.event.inputs.crf || '16' }}"
          BITRATE="${{ github.event.inputs.bitrate || '' }}"
          EXTRA_ARGS="--crf=$CRF"
          if [ -n "$BITRATE" ]; then EXTRA_ARGS="--bitrate=$BITRATE"; fi
          echo "COMP_ID=$COMP_ID" >> $GITHUB_ENV
          npx remotion render src/entry.tsx "$COMP_ID" "out/$COMP_ID.mp4" $EXTRA_ARGS --timeout=120000

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMP_ID }}
          path: out/${{ env.COMP_ID }}.mp4
