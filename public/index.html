<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Lokal Saya</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 48px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      max-width: 520px;
    }
    h1 { font-size: 2.2rem; margin-bottom: 12px; }
    p { color: #cbd5e1; line-height: 1.7; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      background: #22c55e;
      color: #052e16;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
    code {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 2px 8px;
      border-radius: 6px;
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">&#10003; Server Berjalan</span>
    <h1>Halo! Selamat datang &#128075;</h1>
    <p>Website lokal Anda berjalan di <code>localhost:5000</code>.</p>
    <p>Kamu bisa mengubah file <code>public/index.html</code> untuk mengedit halaman ini.</p>
  </div>
</body>
</html>
